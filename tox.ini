[tox]

requires =
    tox>4

envlist=
    py{39,310,311,312}-dj4.2-test
    py{310,311,312}-dj5.0-test
    py{310,311,312,313}-dj5.1-test
    py{310,311,312,313}-dj5.2-test
    py{310,311,312,313}-ruff
    py312-djmaster-test,

[testenv]
basepython =
    py39: python3.9
    py310: python3.10
    py311: python3.11
    py312: python3.12
    py313: python3.13

pip_pre = true

deps =
    ruff

    dj4.2: Django>=4.2,<4.3
    dj5.0: Django>=5.0,<5.1
    dj5.1: Django>=5.1,<5.2
    dj5.2: Django>=5.2,<5.3
    djmaster: https://github.com/django/django/archive/refs/heads/main.zip

allowlist_externals = *

commands =
    test: ./run_test.py
    ruff: ruff check .
