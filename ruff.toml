target-version = "py310"
extend-exclude = ["migrations", "*/static/CACHE/*", "docs", "manage.py"]

[lint]
select = [
    "E", # PEP8 errors
    "W", # PEP8 warnings
    "F", # PyFlakes
    "T201", # flake8-print
    "TID252", # flake8-tidy-imports
    "UP", # pyupgrade
    "C901", # mccabe
]

[lint.pycodestyle]
max-line-length = 100

[lint.mccabe]
max-complexity = 10
